name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy notion-daily-report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Upload application files
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.SCP_HOST }}
          username: ${{ secrets.SCP_USER }}
          key: ${{ secrets.SCP_PRIVATE_KEY }}
          port: ${{ secrets.SCP_PORT || '22' }}
          timeout: 120s
          source: ".htaccess,app/**,composer.json,composer.lock,README.md,LICENSE"
          target: "/home/u685478147/public_html/public_html/notion_daily_report"
          overwrite: true

      - name: Install production dependencies
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.SCP_HOST }}
          username: ${{ secrets.SCP_USER }}
          key: ${{ secrets.SCP_PRIVATE_KEY }}
          port: ${{ secrets.SCP_PORT || '22' }}
          timeout: 120s
          script: |
            cd /home/u685478147/public_html/public_html/notion_daily_report
            mkdir -p app/logs
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
